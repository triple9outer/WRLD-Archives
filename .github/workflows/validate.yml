name: Validate WRLD Archives

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app files
        run: node scripts/validate.mjs
      - name: Test catalog behavior
        run: node --test catalog.test.mjs lyrics-api.test.mjs
