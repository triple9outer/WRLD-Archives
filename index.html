  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function displayArtists(t){const suffix=t.title.match(/\s*\((?:feat\.?|ft\.?)\s*([^)]+)\)\s*$/i);const raw=[t.features||'',suffix?suffix[1]:''].join(', ');const names=raw.split(/,|&|\band\b|\bfeat\.?\b|\bft\.?\b|\bwith\b/i).map(x=>x.trim()).filter(Boolean);const others=[...new Set(names.filter(x=>!/juice\s*wrld/i.test(x)))];return ['Juice WRLD',...others].join(' & ')}

  const audioExt=/\.(mp3|m4a|flac|wav|aac|ogg|opus|aiff?|alac)$/i;

  async function syncCatalog(showMessage=false){const button=document.querySelector('#loadLeaks');if(button){button.disabled=true;button.textContent='Syncing…'}try{const response=await fetch('https://juicewrldapi.com/juicewrld/songs/?all=true&versions=true');if(!response.ok)throw Error(`API returned ${response.status}`);const data=await response.json();if(!Array.isArray(data))throw Error('Unexpected catalog format');const existing=new Map(tracks.map((t,i)=>[`${t.title.toLowerCase()}|${(t.version||'').toLowerCase()}`,i]));let added=0,updated=0;for(const song of data){if(!['released','unreleased','unsurfaced'].includes(song.category))continue;const raw=String(song.name||song.track_titles?.[0]||'').trim();if(!raw)continue;const found=raw.match(/\s*[[(](v\d+(?:\.\d+)?)[\])]\s*$/i);const title=raw.replace(/\s*[[(]v\d+(?:\.\d+)?[\])]\s*$/i,'').trim();const version=String(song.version_title||found?.[1]||'');const projectAlbum=({ 'too many':'The Outsiders','off the rip':'The Outsiders' })[title.toLowerCase()]||'';const key=`${title.toLowerCase()}|${version.toLowerCase()}`;const era=typeof song.era==='object'?song.era?.name:song.era;const category=String(song.category||'');const status=category==='released'?'released':'unreleased';const leakStatus=category==='unsurfaced'?'unleaked':'leaked';const meta={sourceCategory:category,album:projectAlbum||String(song.album||''),era:String(era||''),altTitles:Array.isArray(song.track_titles)?song.track_titles:[],features:String(song.credited_artists||''),producers:String(song.producers||''),engineers:String(song.engineers||''),recorded:String(song.record_dates||'')};if(existing.has(key)){const t=tracks[existing.get(key)];if(t.status!==status){t.status=status;updated++}if(t.sourceCategory!==category){t.sourceCategory=category;updated++}const assignedLeakStatus=t.remaster?'unleaked':leakStatus;if(status==='unreleased'&&t.leakStatus!==assignedLeakStatus){t.leakStatus=assignedLeakStatus;updated++}for(const [field,value] of Object.entries(me   function render(){rebuildDuplicateNames();const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value,lf=document.querySelector('#leakFilter').value,ff=document.querySelector('#favoriteFilter').value,sortMode=document.querySelector('#sort').value;const groupName=t=>t.album||(t.status==='unreleased'?'Unreleased':'Other released');const groups=releasedAlbums.filter(name=>tracks.some(t=>t.album?.toLowerCase()===name.toLowerCase()));document.querySelector('#releasedProjects').innerHTML=groups.map(name=>`<button class="project ${activeAlbum===name&&!singlesOnly?'active':''}" data-album="${esc(name)}"><b>${esc(name)}</b><span>${tracks.filter(t=>groupName(t)===name).length} songs · select tab</span></button>`).join('')+`<button class="project ${activeAlbum===''&&!singlesOnly?'active':''}" data-album=""><b>All songs</b><span>${tracks.length} songs</span></button>`;document.querySelector('#projects').innerHTML=unreleasedAlbums.map(name=>`<button class="project ${activeAlbum===name&&!singlesOnly?'active':''}" data-album="${esc(name)}"><b>${esc(name)}</b><span>Unreleased project · ${tracks.filter(t=>t.album?.toLowerCase()===name.toLowerCase()).length} songs</span></button>`).join('');document.querySelector('#singlesTab').classList.toggle('active',singlesOnly);const remastersTab=document.querySelector('#remastersTab');const remasterCount=tracks.filter(t=>t.remaster).length;remastersTab.textContent=`Remasters (${remasterCount})`;remastersTab.classList.toggle('active',remastersOnly);const rows=tracks.filter(t=>(f==='all'||t.status===f)&&(lf==='all'||(t.status==='unreleased'&&(t.leakStatus||'leaked')===lf))&&(activeAlbum===''||groupName(t)===activeAlbum)&&(ff==='all'||t.favorite)&&(!singlesOnly||t.single)&&(!remastersOnly||t.remaster)&&[t.title,t.album,t.version,t.altTitles,t.producers,t.engineers,t.features,t.era].join(' ').toLowerCase().includes(q)).sort((a,b)=>sortMode==='za'?b.title.localeCompare(a.title,undefined,{sensitivity:'bas
